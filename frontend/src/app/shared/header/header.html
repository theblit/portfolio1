<a class="skip-link" href="#contenu">Aller au contenu</a>

<header class="header" [class.is-scrolled]="scrolled() || !onHome()" [class.is-open]="menuOpen()">
  <div class="container header__inner">
    <a href="#accueil" class="header__logo" (click)="go($event, 'accueil')" aria-label="Kolawole, retour à l'accueil">
      <span class="header__logo-mark" aria-hidden="true">K</span>
      <span>Kolawole<span class="header__logo-dot">.</span></span>
    </a>

    <nav class="header__nav" aria-label="Navigation principale">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              [class.is-active]="active() === link.id"
              [attr.aria-current]="active() === link.id ? 'true' : null"
              (click)="go($event, link.id)"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="header__theme"
        (click)="themeService.toggle()"
        [attr.aria-label]="isDark() ? 'Passer au thème clair' : 'Passer au thème sombre'"
        [attr.title]="isDark() ? 'Thème clair' : 'Thème sombre'"
      >
        @if (isDark()) {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        }
      </button>
      <a [href]="cv.file" target="_blank" rel="noopener" class="btn btn--primary btn--small header__cta">Mon CV</a>
      <button
        type="button"
        class="header__burger"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="menu-mobile"
        [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
        (click)="toggleMenu()"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="menu-backdrop" [class.is-open]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

<nav id="menu-mobile" class="menu" [class.is-open]="menuOpen()" aria-label="Menu mobile">
  <ul>
    @for (link of links; track link.id) {
      <li>
        <a [href]="'#' + link.id" [class.is-active]="active() === link.id" (click)="go($event, link.id)">
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
  <a [href]="cv.file" target="_blank" rel="noopener" class="btn btn--primary menu__cta">Télécharger mon CV</a>
</nav>
